# Ontology for the agentic-ai-knowledge-graph.
# Defines the closed set of node types and relationship types used across
# the pilot and (later) full extraction, plus the canonical entity registry
# used to deduplicate the same real-world entity mentioned across documents.
#
# Any node or relationship produced by scripts/extract_document.py or
# scripts/build_graph.py MUST use a type from this file. Nothing else is
# permitted in this phase.

node_types:
  - Document              # a single markdown file (RA root or subpage)
  - ReferenceArchitecture # one per RA folder (RA0001-RA0031), groups its Documents
  - SAPProduct
  - SAPService
  - Capability
  - Agent
  - Protocol
  - API
  - DataSource
  - IdentitySecurity
  - UseCase
  - Requirement
  - Constraint
  - Diagram
  - Source               # external reference (SAP Help, GitHub, YouTube, ...)
  - TechnologyDomain      # derived from front matter `tags` (genai, data, appdev, integration, opsec)

relationship_types:
  - PART_OF               # Document PART_OF ReferenceArchitecture
  - USES                  # e.g. ReferenceArchitecture USES SAPService
  - CONNECTS_TO
  - REQUIRES
  - DEPENDS_ON
  - EXPOSES               # e.g. SAPService EXPOSES API
  - CONSUMES_DATA_FROM
  - AUTHENTICATES_WITH    # e.g. SAPService AUTHENTICATES_WITH IdentitySecurity
  - EXTENDS
  - SUPPORTS_PROTOCOL     # e.g. Agent SUPPORTS_PROTOCOL Protocol
  - DOCUMENTED_BY         # Entity DOCUMENTED_BY Source
  - HAS_SOURCE            # Document HAS_SOURCE Source
  - HAS_DIAGRAM           # Document HAS_DIAGRAM Diagram
  - HAS_USE_CASE          # ReferenceArchitecture HAS_USE_CASE UseCase
  - BELONGS_TO_DOMAIN     # Document/ReferenceArchitecture BELONGS_TO_DOMAIN TechnologyDomain
  - MENTIONS              # generic, low-confidence: Document MENTIONS Entity

# evidence_type is mandatory on every node and relationship record:
#   explicit  - directly asserted by the source (literal named mention, a
#               markdown link in a "Services and Components"/"Resources"
#               section, an explicit sentence describing the relation, or a
#               structural fact derivable from the repository itself, e.g.
#               folder membership or front matter fields).
#   inferred  - derived by pattern-matching/heuristic that requires
#               interpretation beyond the literal text (e.g. two entities
#               co-occurring in the same paragraph with no explicit verb
#               connecting them).
# confidence is a float in [0,1]. explicit facts default to 0.9-1.0,
# inferred facts must be <= 0.6.

# Canonical entity registry: maps text aliases (lowercased, matched as
# substrings) to a single canonical entity so the same real-world thing
# mentioned in different documents/wordings collapses to one node.
canonical_entities:
  - canonical_id: sap-btp
    canonical_name: "SAP Business Technology Platform (BTP)"
    type: SAPService
    aliases: ["sap btp", "business technology platform"]

